# CI: split topology on the bundled single-instance Postgres: TLS from a
# Secret (the workflow makes a throwaway CA), a non-superuser role, the
# pg_dump CronJob and the egress policy. (database.bundled.tls.certManager
# is covered by deploy/helm_chart_db_test.go.)
image:
  repository: langstroth-relay
  tag: ci
database:
  mode: bundled
  bundled:
    auth:
      existingSecret: relay-postgres-auth
    tls:
      existingSecret: relay-postgres-tls
    persistence:
      size: 256Mi
      # Portable across provisioners (some refuse ReadWriteOncePod).
      accessModes: [ReadWriteOnce]
    backups:
      keep: 3
      persistence:
        size: 256Mi
tunnel:
  mode: open
